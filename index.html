<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nature Paradise | Mini Market</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17362b;background:#f6f8f3}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#06472e,#126b45);color:white;padding:30px max(20px,calc((100vw - 1100px)/2));}header h1{margin:0;font-size:clamp(25px,4vw,42px)}header p{margin:8px 0 0;color:#e6f4e7}main{max-width:1100px;margin:auto;padding:22px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}button{cursor:pointer;background:#126b45;color:white;border:0;border-radius:9px;padding:11px 16px;font-weight:650}button.secondary{background:white;color:#126b45;border:1px solid #b8cfc1}button.danger{background:#a62f2f}button:disabled{opacity:.55;cursor:wait}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd9d0;border-radius:8px;background:white;font:inherit}label{display:block;font-weight:600;margin:12px 0 5px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.toolbar>*{flex:1;min-width:180px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.product{background:white;border:1px solid #e0e8df;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #1232}.product img,.placeholder{width:100%;height:180px;object-fit:cover;background:#e5efe5}.placeholder{display:grid;place-items:center;font-size:50px}.details{padding:15px}.details h3{margin:0 0 6px}.price{font-size:23px;color:#11683e;font-weight:800;margin:10px 0}.muted{color:#64776a;font-size:14px}.panel{background:white;border:1px solid #e0e8df;border-radius:14px;padding:20px;margin-bottom:20px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}.hide{display:none!important}.notice{padding:12px;border-radius:9px;background:#e6f2e8;margin:12px 0}.error{background:#fce9e9;color:#8a2020}.adminrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}footer{text-align:center;padding:30px;color:#68776b}@media(max-width:500px){header{padding:24px 20px}main{padding:14px}}
</style></head><body><header><h1>🌿 Nature Paradise Mini Market</h1><p>Tu tienda dentro de Nature Paradise Jarabacoa · Your convenient guest shop</p></header><main><nav><button id="catalogTab">Ver tienda / Shop</button><button class="secondary" id="adminTab">Administración privada</button><button class="secondary hide" id="logout">Cerrar sesión</button></nav><section id="catalog"><div class="toolbar"><input id="search" placeholder="Buscar producto / Search products"><select id="category"><option value="">Todas las categorías / All categories</option></select></div><div id="catalogStatus" class="notice">Cargando catálogo…</div><div id="products" class="products"></div>
<div id="products" class="products"></div>

<!-- AQUÍ PEGAS EL CÓDIGO DEL BOTÓN DE WHATSAPP -->

</section><section id="admin"</section><section id="admin" class="hide"><div id="loginPanel" class="panel"><h2>Acceso de administrador</h2><p class="muted">Inicia sesión con el usuario autorizado en Supabase.</p><form id="loginForm"><label>Correo electrónico</label><input type="email" id="email" required autocomplete="username"><label>Contraseña</label><input type="password" id="password" required autocomplete="current-password"><p><button type="submit">Entrar</button></p></form><div id="loginStatus"></div></div><div id="managePanel" class="hide"><div class="panel"><h2 id="formTitle">Añadir producto</h2><form id="productForm"><div class="formgrid"><div><label>Nombre</label><input id="name" required></div><div><label>Categoría</label><input id="prodCategory" required placeholder="Snacks, Bebidas, Higiene..."></div><div><label>Precio de venta (RD$)</label><input id="price" type="number" min="0" step="0.01" required></div><div><label>Cantidad disponible</label><input id="quantity" type="number" min="0" step="1" required></div><div><label>Fotografía (JPG, PNG o WebP; máximo 5 MB)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></div><div><label>URL de imagen (opcional)</label><input id="imageUrl" type="url" placeholder="https://..."></div></div><label>Descripción</label><textarea id="description" rows="2"></textarea><div class="adminrow"><button type="submit" id="saveProduct">Guardar producto</button><button type="button" class="secondary" id="resetForm">Cancelar edición</button></div></form><div id="saveStatus"></div></div><div class="panel"><h2>Inventario</h2><div id="adminStatus"></div><div id="adminProducts" class="products"></div></div></div></section></main><footer>Nature Paradise Jarabacoa · Precios en pesos dominicanos</footer><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://mfsktzahxzobizpviadv.supabase.co';
const KEY='sb_publishable_12550i2uB9tMwTbluiVfFA_AteekUYN';
const db=createClient(URL,KEY);const $=id=>document.getElementById(id);let publicItems=[],adminItems=[],editing=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-DO',{style:'currency',currency:'DOP',maximumFractionDigits:2}).format(Number(n||0));
const show=(id,on=true)=>$(id).classList.toggle('hide',!on);
function message(id,text,error=false){$(id).textContent=text;$(id).className=text?'notice'+(error?' error':''):''}
function card(p,admin=false){const el=document.createElement('article');el.className='product';const image=p.image_url&&/^https:\/\//i.test(p.image_url)?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:'<div class="placeholder">🛍️</div>';el.innerHTML=`${image}<div class="details"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.category||'Otros')}</div><p>${esc(p.description||'')}</p><div class="price">${money(p.price)}</div><div class="muted">${Number(p.quantity)>0?'':'🔴 Agotado / Out of stock'}</div>${admin?'<div class="adminrow"><button class="edit">Editar</button><button class="secondary stock">Marcar agotado</button><button class="danger delete">Eliminar</button></div>':''}</div>`;if(admin){;el.querySelector('.stock').onclick=()=>markOutOfStock(p)}return el}
async function loadCatalog(){message('catalogStatus','Cargando catálogo…');const {data,error}=await db.from('market_catalog').select('id,name,category,description,price,quantity,image_url').order('name');if(error){message('catalogStatus','No se pudo cargar el catálogo: '+error.message,true);return}publicItems=data||[];const categories=[...new Set(publicItems.map(p=>p.category).filter(Boolean))].sort();$('category').innerHTML='<option value="">Todas las categorías / All categories</option>'+categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');renderCatalog()}
function renderCatalog(){const q=$('search').value.trim().toLowerCase(),c=$('category').value;const items=publicItems.filter(p=>(!c||p.category===c)&&(!q||[p.name,p.category,p.description].join(' ').toLowerCase().includes(q)));$('products').replaceChildren(...items.map(p=>card(p)));message('catalogStatus',items.length?'': 'No hay productos disponibles por el momento / No products found.')}
$('search').oninput=renderCatalog;$('category').onchange=renderCatalog;
$('catalogTab').onclick=()=>{show('catalog');show('admin',false);loadCatalog()};$('adminTab').onclick=()=>{show('catalog',false);show('admin');refreshAuth()};
$('loginForm').onsubmit=async e=>{e.preventDefault();message('loginStatus','Iniciando sesión…');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)message('loginStatus',error.message,true);else{message('loginStatus','');$('password').value='';await refreshAuth()}};
$('logout').onclick=async()=>{await db.auth.signOut();await refreshAuth()};
async function refreshAuth(){const {data:{user}}=await db.auth.getUser();if(!user){show('loginPanel');show('managePanel',false);show('logout',false);return}const {data,error}=await db.from('market_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){show('loginPanel',false);show('managePanel',false);show('logout');message('loginStatus','Tu usuario no está autorizado para administrar la tienda.',true);return}show('loginPanel',false);show('managePanel');show('logout');await loadAdmin()}
async function loadAdmin(){message('adminStatus','Cargando inventario…');const {data,error}=await db.from('market_products').select('*').order('name');if(error){message('adminStatus',error.message,true);return}adminItems=data||[];$('adminProducts').replaceChildren(...adminItems.map(p=>card(p,true)));message('adminStatus',adminItems.length?'':'Todavía no hay productos. Añade el primero.')}
function reset(){editing=null;$('productForm').reset();$('formTitle').textContent='Añadir producto';message('saveStatus','')};$('resetForm').onclick=reset;
function edit(p){editing=p.id;$('formTitle').textContent='Editar producto';for(const [id,key] of [['name','name'],['prodCategory','category'],['price','price'],['quantity','quantity'],['description','description'],['imageUrl','image_url']])$(id).value=p[key]??'';$('photo').value='';message('saveStatus','');window.scrollTo({top:0,behavior:'smooth'})}
async function uploadPhoto(file){if(!file)return null;if(file.size>5*1024*1024)throw Error('La imagen supera 5 MB');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Formato de imagen no permitido');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=`products/${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from('product-images').upload(path,file,{contentType:file.type,upsert:false});if(error)throw Error('No se pudo subir la foto. Revisa las políticas de Storage: '+error.message);return db.storage.from('product-images').getPublicUrl(path).data.publicUrl}
$('productForm').onsubmit=async e=>{e.preventDefault();$('saveProduct').disabled=true;message('saveStatus','Guardando…');try{let image_url=$('imageUrl').value.trim()||null;const file=$('photo').files[0];if(file)image_url=await uploadPhoto(file);const payload={name:$('name').value.trim(),category:$('prodCategory').value.trim(),description:$('description').value.trim(),price:Number($('price').value),quantity:Number($('quantity').value),image_url};if(!editing)payload.active=true;const result=editing?await db.from('market_products').update(payload).eq('id',editing).select():await db.from('market_products').insert(payload).select();if(result.error)throw result.error;reset();message('saveStatus','Producto guardado correctamente.');await Promise.all([loadAdmin(),loadCatalog()])}catch(err){message('saveStatus',err.message,true)}finally{$('saveProduct').disabled=false}};
async function markOutOfStock(p){
  if(!confirm('¿Marcar '+p.name+' como agotado?'))return;
  const {error}=await db.from('market_products')
    .update({quantity:0})
    .eq('id',p.id);
  if(error){
    message('adminStatus',error.message,true);
  }else{
    await Promise.all([loadAdmin(),loadCatalog()]);
  }
}
async function remove(p){if(!confirm('¿Eliminar '+p.name+' del inventario?'))return;const {error}=await db.from('market_products').delete().eq('id',p.id);if(error)message('adminStatus',error.message,true);else await Promise.all([loadAdmin(),loadCatalog()])}
loadCatalog();
</script></body></html>
